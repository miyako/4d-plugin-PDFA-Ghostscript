name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: bump-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          python3 .github/scripts/release.py bump --bump "$BUMP"

      - name: Commit metadata to selected branch (no tag)
        env:
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION PDFA/Info.plist
          git commit -m "Bump version to $VERSION"
          git push --no-follow-tags origin "HEAD:refs/heads/$BRANCH"
          echo "Committed version $VERSION to $BRANCH. No tag or release created; run Build separately." >> "$GITHUB_STEP_SUMMARY"
